name: CI Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    lint:
        name: Lint Code
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: ESLINT_USE_FLAT_CONFIG=false npm run lint:check

            - name: Check Prettier formatting
              run: npm run format:check

    type-check:
        name: TypeScript Type Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npx tsc --noEmit

    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests with coverage
              run: npm run test:cov

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v4
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/lcov.info
                  flags: unittests
                  name: codecov-umbrella
                  fail_ci_if_error: false

    e2e-tests:
        name: E2E Tests
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:15-alpine
                env:
                    POSTGRES_USER: tug_user
                    POSTGRES_PASSWORD: tug_password
                    POSTGRES_DB: tug_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run E2E tests
              run: npm run test:e2e
              env:
                  NODE_ENV: test
                  DATABASE_HOST: localhost
                  DB_HOST: localhost
                  DATABASE_PORT: 5432
                  DB_PORT: 5432
                  DATABASE_USER: tug_user
                  DB_USERNAME: tug_user
                  DATABASE_PASSWORD: tug_password
                  DB_PASSWORD: tug_password
                  DATABASE_NAME: tug_test
                  DB_NAME: tug_test
                  REDIS_HOST: localhost
                  REDIS_PORT: 6379

    build:
        name: Build Application
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build application
              run: npm run build

            - name: Check build artifacts
              run: |
                  if [ ! -d "dist" ]; then
                    echo "Build failed: dist directory not found"
                    exit 1
                  fi
                  echo "Build successful!"

    security-audit:
        name: Security Audit
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Run npm audit
              run: npm audit --audit-level=moderate
              continue-on-error: true

    docker-build:
        name: Docker Build Verification
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: false
                  tags: tug:ci-test
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    summary:
        name: CI Summary
        runs-on: ubuntu-latest
        needs:
            [
                lint,
                type-check,
                unit-tests,
                e2e-tests,
                build,
                security-audit,
                docker-build,
            ]
        if: always()
        steps:
            - name: Check all jobs status
              run: |
                  echo "CI Pipeline Results:"
                  echo "===================="
                  echo "Lint: ${{ needs.lint.result }}"
                  echo "Type Check: ${{ needs.type-check.result }}"
                  echo "Unit Tests: ${{ needs.unit-tests.result }}"
                  echo "E2E Tests: ${{ needs.e2e-tests.result }}"
                  echo "Build: ${{ needs.build.result }}"
                  echo "Security Audit: ${{ needs.security-audit.result }}"
                  echo "Docker Build: ${{ needs.docker-build.result }}"

                  if [ "${{ needs.lint.result }}" != "success" ] || \
                     [ "${{ needs.type-check.result }}" != "success" ] || \
                     [ "${{ needs.unit-tests.result }}" != "success" ] || \
                     [ "${{ needs.e2e-tests.result }}" != "success" ] || \
                     [ "${{ needs.build.result }}" != "success" ] || \
                     [ "${{ needs.docker-build.result }}" != "success" ]; then
                    echo "❌ CI Pipeline Failed"
                    exit 1
                  else
                    echo "✅ CI Pipeline Passed"
                  fi
