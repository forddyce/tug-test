name: Dependency Update Check

on:
    schedule:
        # Run every Monday at 9:00 AM UTC
        - cron: '0 9 * * 1'
    workflow_dispatch:

jobs:
    dependency-audit:
        name: Check Dependencies
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Check for outdated packages
              run: |
                  npm outdated || true
                  echo "### 📦 Outdated Packages Report" >> $GITHUB_STEP_SUMMARY
                  npm outdated --json > outdated.json || true
                  if [ -s outdated.json ]; then
                    echo "Found outdated packages. Review required." >> $GITHUB_STEP_SUMMARY
                  else
                    echo "✅ All packages are up to date!" >> $GITHUB_STEP_SUMMARY
                  fi

            - name: Security audit
              run: |
                  echo "### 🔒 Security Audit" >> $GITHUB_STEP_SUMMARY
                  npm audit --audit-level=moderate || echo "⚠️ Security vulnerabilities found" >> $GITHUB_STEP_SUMMARY

            - name: Check for breaking changes
              run: |
                  echo "### ⚠️ Review Required" >> $GITHUB_STEP_SUMMARY
                  echo "Run \`npm update\` locally and test before applying updates." >> $GITHUB_STEP_SUMMARY
