services:
    app:
        build:
            context: .
            target: development
        container_name: tug-app
        ports:
            - '${PORT:-3000}:3000'
        environment:
            - NODE_ENV=development
            - DATABASE_HOST=postgres
            - DATABASE_PORT=5432
            - DATABASE_USER=postgres
            - DATABASE_PASSWORD=postgres
            - DATABASE_NAME=tug_dev
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_TTL=3600
        volumes:
            - .:/app
            - /app/node_modules
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
        command: npm run start:dev

    postgres:
        image: postgres:15-alpine
        container_name: tug-postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: tug_dev
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        container_name: tug-redis
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes

volumes:
    postgres_data:
    redis_data:
